name: Gerar App Play Store (.AAB e .APK) - OrganSense

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17 (v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e Aceitar Licencas API 35
        uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gerar Keystore de Assinatura Oficial para Google Play
        run: |
          keytool -genkeypair -v -keystore app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass organsense2026 -keypass organsense2026 -dname "CN=OrganSense, OU=MedTech, O=OrganSense, L=Recife, ST=PE, C=BR"

      - name: Configurar Gradle 8.7 e Compilar APK + AAB
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Disponibilizar Arquivos para Download (.AAB e .APK)
        uses: actions/upload-artifact@v4
        with:
          name: Pacote-Oficial-PlayStore-OrganSense
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/upload-keystore.jks
